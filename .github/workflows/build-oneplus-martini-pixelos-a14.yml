name: Build OnePlus 9RT (PixelOS Android 14)

on:
  workflow_dispatch:
  workflow_call:

env:
  DEVICE_NAME: "OnePlus_9RT"
  DEVICE_CODENAME: "martini"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD=ld.lld LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE: "https://github.com/natsumerinchan/android_kernel_oneplus_sm8350.git"
  # The workflow checks out the exact commit below in a dedicated step.
  KERNEL_BRANCH: "fourteen-qpr3"

  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH: ""
  GCC_GNU: false
  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/lahaina-qgki_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "next"

  # The selected source commit already contains SUSFS modifications.
  # Do not apply the framework's SUSFS patch a second time.
  SUSFS_ENABLE: false
  SUSFS_FIXED: false

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "PixelOS_Android_14_SUSFS"

  PYTHON_VERSION: "3"
  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"
  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: OnePlus 9RT martini
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout build framework
        uses: actions/checkout@v6

      - name: Prepare compilation environment
        uses: ./.github/workflows/build-env

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: Checkout pinned kernel source commit
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          git fetch --no-tags origin bfb34a1d115869100a046ac84677f14b988d8344
          git checkout --detach bfb34a1d115869100a046ac84677f14b988d8344
          test "$(git rev-parse HEAD)" = "bfb34a1d115869100a046ac84677f14b988d8344"

      # SUSFS is already part of the selected kernel source; SUSFS_ENABLE is false
      # above to avoid applying duplicate SUSFS patches.
      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra kernel options
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          echo "Device: OnePlus 9RT (martini)"
          echo "Kernel commit: $(git rev-parse HEAD)"
          echo "Defconfig: vendor/lahaina-qgki_defconfig"

      - name: Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: Build kernel
        uses: ./.github/workflows/build-process

      - name: Pack kernel
        uses: ./.github/workflows/pack-process

      - name: Upload build artifacts
        uses: ./.github/workflows/upload-files
